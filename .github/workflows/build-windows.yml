name: Build Windows RetroArch Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download mGBA Splitscreen source
        uses: actions/checkout@v4
        with:
          repository: Spuds0588/mgba-splitscreen
          ref: master

      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Configure Windows x64 build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_LIBRETRO_SPLITSCREEN=ON \
            -DBUILD_LIBRETRO=OFF \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=OFF \
            -DCMAKE_C_FLAGS="-DCOLOR_16_BIT -DCOLOR_5_6_5"

      - name: Compile RetroArch core
        run: cmake --build build --target mgba_splitscreen_libretro --parallel 4

      - name: Package Windows core
        run: |
          mkdir -p package/cores package/info
          DLL=$(find build -type f -name 'mgba_splitscreen_libretro.dll' -print -quit)
          test -n "$DLL" || { echo "Windows DLL not generated"; exit 1; }
          cp "$DLL" package/cores/
          cp src/platform/libretro-splitscreen/mgba_splitscreen_libretro.info package/info/

      - name: Upload Windows core
        uses: actions/upload-artifact@v4
        with:
          name: mgba-splitscreen-windows-x64
          path: package/
          if-no-files-found: error
